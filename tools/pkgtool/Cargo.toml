[package]
name = "pkgtool"
version = "0.1.0"
edition = "2024"
publish = false
description = "Packs, signs and checks Stackmur packages"

[dependencies]
minisign = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
zstd = "0.13"

[dev-dependencies]
minisign-verify = "0.3.0"
ruzstd = "0.9.1"
tempfile = "3"
